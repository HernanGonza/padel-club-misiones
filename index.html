<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Padel Club Misiones – Proyecciones</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .bg-orange-custom { background-color: #EB632E; }
    .text-orange-custom { color: #EB632E; }
    .border-orange-custom { border-color: #EB632E; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .stat-card { box-shadow: 0 4px 20px rgba(235, 99, 46, 0.15); }
    .feature-icon { background: linear-gradient(135deg, #EB632E, #f97316); }
    .tooltip {
      position: absolute;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      z-index: 50;
      white-space: nowrap;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Accordion = ({ title, children, defaultOpen = false }) => {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div className="border border-gray-200 rounded-xl mb-4 overflow-hidden">
          <button
            onClick={() => setOpen(!open)}
            className="w-full px-6 py-4 text-left font-bold text-lg bg-orange-50 hover:bg-orange-100 flex justify-between items-center"
          >
            {title}
            <span className="text-xl">{open ? '−' : '+'}</span>
          </button>
          {open && (
            <div className="p-5 bg-white border-t border-gray-200 text-base leading-relaxed">
              {children}
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [tab, setTab] = useState('resumen');
      const [subTab, setSubTab] = useState('flujos');

      // Estados para proyecciones
      const [animarProyecciones, setAnimarProyecciones] = useState(false);
      const [yaCargadoProyecciones, setYaCargadoProyecciones] = useState(false);
      const [anioActivo, setAnioActivo] = useState(1);
      const [tooltip, setTooltip] = useState({ visible: false, x: 0, y: 0, value: '' });

      const tabs = ['resumen', 'mercado', 'proyecciones', 'proyecto', 'tecnologia'];

      // === RESUMEN ===
      const renderResumen = () => (
        <div className="space-y-10">
          <div className="text-center max-w-4xl mx-auto">
            <h1 className="text-5xl font-black text-orange-custom mb-6">Padel Club Misiones</h1>
            <p className="text-2xl text-gray-700 mb-8">
              Plataforma integral de pádel: matchmaking inteligente, reservas, torneos, ligas, marketplace y más.
            </p>
            <div className="bg-gradient-to-r from-orange-500 to-orange-600 text-white px-8 py-4 rounded-xl inline-block shadow-xl">
              <p className="text-xl font-bold">+18.000 jugadores · 28 complejos · 100% en Misiones</p>
            </div>
          </div>

          <div className="grid md:grid-cols-2 gap-6">
            <div className="stat-card bg-white p-6 rounded-xl">
              <h3 className="font-bold text-xl mb-3 text-orange-custom">Monetización desde el día 1</h3>
              <ul className="space-y-2">
                <li>• <strong>Reservas:</strong> Comisión del 10% (absorbemos descuentos)</li>
                <li>• <strong>Complejos:</strong> Paquetes premium de marketing y analytics</li>
                <li>• <strong>Profesores:</strong> Comisión del 15% en clases</li>
                <li>• <strong>Marketplace:</strong> Margen 30–40% en productos</li>
                <li>• <strong>Marcas:</strong> Publicidad segmentada</li>
              </ul>
            </div>
            <div className="stat-card bg-white p-6 rounded-xl">
              <h3 className="font-bold text-xl mb-3 text-orange-custom">Valor para Complejos</h3>
              <ul className="space-y-2">
                <li>• Aumento de ocupación en horarios valle</li>
                <li>• Retención con ligas y torneos</li>
                <li>• Descuentos cubiertos por la plataforma</li>
                <li>• Panel de analytics + marketing integrado</li>
              </ul>
            </div>
          </div>
        </div>
      );

      // === PROYECCIONES ===
      const renderProyecciones = () => {
  const datosPorAnio = {
    1: {
      usuarios: 18000,
      ingresos: 13200000,
      mau: [1500, 2800, 4200, 6000, 8500, 11000, 13500, 15500, 17000, 18000, 18500, 19000],
      ingresosMensuales: [300000, 600000, 1000000, 1800000, 2800000, 4200000, 5800000, 7500000, 9000000, 10200000, 11200000, 12000000]
    },
    2: {
      usuarios: 42000,
      ingresos: 32000000,
      mau: [20000, 24000, 27000, 30000, 33000, 35000, 37000, 39000, 40000, 41000, 41500, 42000],
      ingresosMensuales: [1500000, 2000000, 2800000, 4000000, 5500000, 7200000, 9000000, 11000000, 13000000, 15000000, 17000000, 19000000]
    },
    3: {
      usuarios: 75000,
      ingresos: 58000000,
      mau: [45000, 52000, 58000, 62000, 65000, 68000, 70000, 72000, 73000, 74000, 74500, 75000],
      ingresosMensuales: [3000000, 4000000, 5500000, 7500000, 10000000, 13000000, 16000000, 19000000, 22000000, 25000000, 27000000, 29000000]
    }
  };

  const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
  const datos = datosPorAnio[anioActivo];
  const maxHeightPx = 180;
  const valorAAltura = (valor, maxValor) => Math.max((valor / maxValor) * maxHeightPx, 4);
  const maxMAU = Math.max(...datos.mau);
  const maxIngresos = Math.max(...datos.ingresosMensuales);

  const formatARS = (num) => {
    return new Intl.NumberFormat('es-AR', {
      style: 'currency',
      currency: 'ARS',
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    }).format(num);
  };

  // Componente Tooltip local (renderizado dentro del gráfico)
  const TooltipLocal = ({ x, y, value, visible }) => {
    if (!visible) return null;
    return (
      <div
        className="tooltip absolute z-10 bg-black text-white text-xs px-2 py-1 rounded whitespace-nowrap"
        style={{
          left: `${x}px`,
          top: `${y - 30}px`, // arriba de la barra
          transform: 'translateX(-50%)' // centrado
        }}
      >
        {value}
      </div>
    );
  };

  // Gráfico reutilizable
  const Grafico = ({ 
    titulo, 
    datos, 
    maxValor, 
    formato = (v) => `${v.toLocaleString()} usuarios`,
    color = "bg-orange-custom"
  }) => {
    const [tooltip, setTooltip] = useState({ x: 0, y: 0, value: '', visible: false });

    return (
      <div className="relative">
        <h3 className="text-xl font-bold mb-3">{titulo}</h3>
        <div className="flex items-end h-56 gap-1 bg-gray-50 p-4 rounded-lg relative">
          <TooltipLocal {...tooltip} />
          {datos.map((valor, i) => {
            const altura = animarProyecciones ? valorAAltura(valor, maxValor) : 0;
            return (
              <div
                key={i}
                className="flex flex-col items-center flex-1"
                onMouseEnter={(e) => {
                  const rect = e.currentTarget.getBoundingClientRect();
                  const contenedor = e.currentTarget.closest('.relative');
                  const contenedorRect = contenedor.getBoundingClientRect();
                  setTooltip({
                    visible: true,
                    x: rect.left - contenedorRect.left + rect.width / 2,
                    y: rect.top - contenedorRect.top,
                    value: formato(valor)
                  });
                }}
                onMouseLeave={() => setTooltip(prev => ({ ...prev, visible: false }))}
              >
                <div
                  className={`w-full ${color} rounded-t transition-all duration-1000 ease-out ${animarProyecciones ? '' : 'opacity-0'}`}
                  style={{ height: `${altura}px` }}
                ></div>
                <span className="text-xs mt-2 text-gray-600">{months[i]}</span>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  return (
    <div className="space-y-10">
      <h2 className="text-4xl font-black text-center text-orange-custom">Proyecciones de Ingresos – Años 1, 2 y 3</h2>

      <div className="flex justify-center gap-4">
        {[1, 2, 3].map(a => (
          <button
            key={a}
            onClick={() => setAnioActivo(a)}
            className={`px-6 py-3 font-bold rounded-lg ${anioActivo === a ? 'bg-orange-custom text-white' : 'bg-gray-200 hover:bg-gray-300'}`}
          >
            Año {a}
          </button>
        ))}
      </div>

      <div className="grid grid-cols-2 md:grid-cols-3 gap-4 text-center">
        <div className="bg-white p-4 rounded-lg shadow">
          <div className="text-2xl font-black text-orange-custom">{(datos.usuarios / 1000).toFixed(0)}K</div>
          <div className="text-sm text-gray-600">Usuarios activos</div>
        </div>
        <div className="bg-white p-4 rounded-lg shadow">
          <div className="text-2xl font-black text-orange-custom">${(datos.ingresos / 1000000).toFixed(1)}M</div>
          <div className="text-sm text-gray-600">Ingresos anuales</div>
        </div>
        <div className="bg-white p-4 rounded-lg shadow">
          <div className="text-2xl font-black text-orange-custom">{Math.round(datos.ingresos / datos.usuarios)}</div>
          <div className="text-sm text-gray-600">ARS por usuario/año</div>
        </div>
      </div>

      {/* Gráfico: Usuarios activos */}
      <Grafico
        titulo="Usuarios Activos Mensuales (MAU)"
        datos={datos.mau}
        maxValor={maxMAU}
        formato={(v) => `${v.toLocaleString()} usuarios`}
        color="bg-orange-custom"
      />

      {/* Gráfico: Ingresos mensuales */}
      <Grafico
        titulo="Ingresos Mensuales (ARS)"
        datos={datos.ingresosMensuales}
        maxValor={maxIngresos}
        formato={formatARS}
        color="bg-green-500"
      />

      <div className="bg-orange-50 border-l-4 border-orange-custom p-4 rounded">
        <p className="text-sm">
          <strong>Supuestos:</strong> Crecimiento orgánico + adopción en complejos + torneos + misiones.
          Ingresos netos de la plataforma (comisiones, marketplace, clases, publicidad).
        </p>
      </div>
    </div>
  );
};

      // === MERCADO ===
      const renderMercado = () => (
        <div className="space-y-8">
          <h2 className="text-4xl font-black text-center text-orange-custom">Mercado – Misiones</h2>
          <div className="grid md:grid-cols-2 gap-8">
            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold mb-3">Jugadores</h3>
              <ul className="space-y-2 text-lg">
                <li>• +18.000 activos en Posadas y zona</li>
                <li>• Crecimiento anual: 35%</li>
                <li>• 68% busca compañeros frecuentemente</li>
              </ul>
            </div>
            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold mb-3">Complejos</h3>
              <ul className="space-y-2 text-lg">
                <li>• 28 complejos operativos</li>
                <li>• Ocupación promedio: 58%</li>
                <li>• Cero plataformas de matchmaking locales</li>
              </ul>
            </div>
          </div>
        </div>
      );

      // === FLUJOS ===
      const flujos = [
        { titulo: "1. Reserva Individual o Dupla Tradicional", contenido: (
          <ol className="list-decimal pl-8 space-y-2">
            <li>Buscás canchas por zona, fecha y hora</li>
            <li>Filtrás por precio, tipo de cancha, techada/descubierta, valoraciones</li>
            <li>Ves precios dinámicos (pico +30%, valle -40%, anticipada, último minuto)</li>
            <li>Elegís única o recurrente (todos los martes 20 hs)</li>
            <li>Pagás con Mercado Pago</li>
            <li>Recibís QR + recordatorios automáticos</li>
            <li>Check-in al llegar</li>
          </ol>
        )},
        { titulo: "2. Tengo cancha, busco 1-3 jugadores", contenido: (
          <ol className="list-decimal pl-8 space-y-2">
            <li>Reservás la cancha</li>
            <li>Marcás “Buscar compañeros”</li>
            <li>Indicás cuántos faltan, posición (drive/revés), nivel y costo por persona</li>
            <li>Se publica en el feed</li>
            <li>IA sugiere jugadores y envía notificaciones push</li>
            <li>Aceptás/rechazás según perfil verificado</li>
            <li>Chat grupal automático + pagos divididos</li>
          </ol>
        )},
        { titulo: "3. Quiero jugar, busco partido abierto", contenido: "Navegas feed → filtrás → ves jugadores ya confirmados → te unís → pagás tu parte → entrás al chat y QR." },
        { titulo: "4. Crear Equipo Permanente", contenido: "Nombre + logo → dupla fija → estadísticas → desafiar rivales → ligas como equipo." },
        { titulo: "5. Emparejamiento Automático", contenido: "Activás “Quiero jugar” → IA cruza horarios, nivel y ubicación → te propone partidos perfectos." },
        { titulo: "6. Inscripción a Torneos", contenido: "Complejo crea torneo → inscribís sola o con compañero → IA sugiere pareja → brackets automáticos → premios vía Mercado Pago." },
        { titulo: "7. Ligas Zonales", contenido: "Puntos por partido → ranking semanal → ascenso/descenso → premios de temporada." },
        { titulo: "8. Misiones Diarias/Semanales", contenido: "Ejemplos: Juega hoy → 200 XP, Juega en horario valle → 20% off, Invita amigo → 500 XP." },
        { titulo: "9. Feed Social", contenido: "Publicás resultados, fotos, videos → likes, comentarios, check-ins." },
        { titulo: "10. Gestión Flexible de Reservas", contenido: "Recurrentes, lista de espera, extender turno en vivo, cambio de horario, swap y subarriendo." },
        { titulo: "11. Marketplace", contenido: "Paletas, pelotas, ropa → retiro en próximo partido o envío → reseñas y bundles." },
        { titulo: "12. Clases y Clinics", contenido: "Directorio de profesores → clases individuales/grupales → planes progresivos → reseñas." }
      ];

      // === PROYECTO ===
      const renderProyecto = () => (
        <div className="space-y-8">
          <h2 className="text-4xl font-black text-orange-custom">Proyecto Completo</h2>

          <div className="flex flex-wrap gap-2 border-b-2 border-orange-custom pb-2">
            {['flujos', 'caracteristicas', 'monetizacion', 'expansion', 'premios'].map(t => (
              <button key={t} onClick={() => setSubTab(t)}
                className={`px-5 py-2 font-bold rounded-t-lg ${subTab === t ? 'bg-orange-custom text-white' : 'bg-gray-200 hover:bg-gray-300'}`}>
                {t === 'flujos' ? '12 Flujos' : t === 'caracteristicas' ? 'Características' : t === 'monetizacion' ? 'Monetización' : t === 'expansion' ? 'Expansión' : 'Premios'}
              </button>
            ))}
          </div>

          {subTab === 'flujos' && (
            <div>
              <h3 className="text-3xl font-bold text-orange-custom mb-6">Flujos de Usuario</h3>
              {flujos.map((f, i) => (
                <Accordion key={i} title={f.titulo} defaultOpen={i < 3}>
                  {f.contenido}
                </Accordion>
              ))}
            </div>
          )}

          {subTab === 'caracteristicas' && (
            <div>
              <h3 className="text-3xl font-bold text-orange-custom mb-6">Características Clave</h3>
              <div className="grid md:grid-cols-2 gap-4">
                {[
                  "Matchmaking Inteligente con IA",
                  "Torneos con brackets automáticos",
                  "Ligas con ascenso/descenso",
                  "Misiones diarias + XP + niveles",
                  "Feed social y check-ins",
                  "Chat grupal con encuestas",
                  "Precios dinámicos (clima, horario, ocupación)",
                  "Reservas recurrentes y lista de espera"
                ].map((f, i) => (
                  <div key={i} className="flex items-start p-4 bg-orange-50 rounded-lg border border-orange-200">
                    <span className="feature-icon text-white w-8 h-8 rounded-full flex items-center justify-center mr-3 flex-shrink-0">
                      <i className="fas fa-check"></i>
                    </span>
                    <span>{f}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {subTab === 'monetizacion' && (
            <div className="grid md:grid-cols-2 gap-4">
              {[
                "Comisión 10% en reservas (descuentos absorbidos por plataforma)",
                "Suscripciones premium para complejos: $5,000 ARS/mes",
                "Comisión 15% en clases con profesores verificados",
                "Marketplace propio: margen 30–40% en productos",
                "Publicidad segmentada para marcas: banners, posts patrocinados"
              ].map((item, i) => (
                <div key={i} className="flex items-start p-4 bg-orange-50 rounded-lg border border-orange-200">
                  <span className="feature-icon text-white w-8 h-8 rounded-full flex items-center justify-center mr-3 flex-shrink-0">
                    <i className="fas fa-dollar-sign"></i>
                  </span>
                  <span>{item}</span>
                </div>
              ))}
            </div>
          )}

          {subTab === 'expansion' && (
            <div className="space-y-4">
              <h3 className="text-2xl font-bold text-orange-custom">Estrategia de Expansión</h3>
              <ul className="list-disc pl-6 space-y-2">
                <li><strong>Fase 1:</strong> Consolidación en toda Misiones (Posadas, Oberá, Iguazú, Eldorado)</li>
                <li><strong>Fase 2:</strong> Escalado a provincias vecinas (Corrientes, Chaco, Formosa)</li>
                <li><strong>Fase 3:</strong> Multi-deporte: misma arquitectura para tenis, fútbol 5, pickleball</li>
              </ul>
            </div>
          )}

          {subTab === 'premios' && (
            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold text-orange-custom mb-3">Premios sin riesgo legal</h3>
              <ul className="list-disc pl-6 space-y-2">
                <li>Créditos canjeables en reservas</li>
                <li>Productos del marketplace (paletas, ropa, accesorios)</li>
                <li>Clases gratuitas con profesores certificados</li>
                <li>Servicios: estacionamiento VIP, acceso a canchas premium</li>
                <li><strong>Nunca en efectivo</strong> → evita regulaciones de juego de azar</li>
              </ul>
            </div>
          )}
        </div>
      );

      // === TECNOLOGÍA ===
      const renderTecnologia = () => (
        <div className="space-y-8">
          <h2 className="text-4xl font-black text-center text-orange-custom">Tecnología y Costos</h2>
          <div className="grid md:grid-cols-2 gap-6">
            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-xl font-bold mb-3">Stack Técnico</h3>
              <ul className="space-y-2">
                <li>• Web: Next.js 14 + Tailwind CSS</li>
                <li>• Mobile: React Native + Expo</li>
                <li>• Backend: Supabase (PostgreSQL, Auth, Storage, Functions)</li>
                <li>• Hosting: Vercel + Supabase + Expo EAS</li>
              </ul>
            </div>
            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-xl font-bold mb-3">Costos Iniciales (~USD)</h3>
              <ul className="space-y-2">
                <li>• Vercel Pro: $20/mes</li>
                <li>• Supabase Pro: $25/mes</li>
                <li>• Expo EAS: $29/mes</li>
                <li>• Servicios (email/SMS): ~$20/mes</li>
                <li className="font-bold">Total estimado: ~$230 USD/mes</li>
              </ul>
            </div>
          </div>
        </div>
      );

      const tabContent = () => {
        if (tab === 'resumen') return renderResumen();
        if (tab === 'mercado') return renderMercado();
        if (tab === 'proyecciones') return renderProyecciones();
        if (tab === 'proyecto') return renderProyecto();
        if (tab === 'tecnologia') return renderTecnologia();
      };

      // Activar animación cuando se entra a "proyecciones"
      useEffect(() => {
        if (tab === 'proyecciones' && !yaCargadoProyecciones) {
          const timer = setTimeout(() => {
            setAnimarProyecciones(true);
            setYaCargadoProyecciones(true);
          }, 100);
          return () => clearTimeout(timer);
        }
        if (tab !== 'proyecciones' && yaCargadoProyecciones) {
          setAnimarProyecciones(false);
          setYaCargadoProyecciones(false);
        }
      }, [tab, yaCargadoProyecciones]);

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50">
          <nav className="sticky top-0 bg-white shadow-xl border-b-4 border-orange-custom z-50">
            <div className="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
              <div className="flex items-center space-x-4">
                <div className="bg-orange-custom text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl font-black">PC</div>
                <div>
                  <h1 className="text-3xl font-black text-orange-custom">Padel Club</h1>
                  <p className="text-xl font-semibold">Misiones</p>
                </div>
              </div>
              <a href="mailto:hola@padelclubmisiones.com.ar" className="bg-orange-custom hover:bg-orange-700 text-white font-bold text-lg px-6 py-3 rounded-lg shadow transition">
                Contacto
              </a>
            </div>
          </nav>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-10">
            <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
              <div className="flex flex-wrap border-b-2 border-orange-custom">
                {tabs.map(t => (
                  <button key={t} onClick={() => setTab(t)}
                    className={`px-5 py-4 font-bold text-lg flex-1 md:flex-none transition ${tab === t ? 'bg-orange-custom text-white' : 'bg-gray-100 hover:bg-gray-200'}`}>
                    {t === 'resumen' ? 'Resumen' : 
                     t === 'mercado' ? 'Mercado' : 
                     t === 'proyecciones' ? 'Proyecciones' : 
                     t === 'proyecto' ? 'Proyecto' : 
                     'Tecnología'}
                  </button>
                ))}
              </div>
              <div className="p-6 md:p-10">
                {tabContent()}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
