<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Padel Club Misiones – Proyecciones</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .bg-orange-custom { background-color: #EB632E; }
    .text-orange-custom { color: #EB632E; }
    .border-orange-custom { border-color: #EB632E; }
    body { font-family: 'Inter', system-ui, sans-serif; }
    .stat-card { box-shadow: 0 4px 20px rgba(235, 99, 46, 0.15); }
    .feature-icon { background: linear-gradient(135deg, #EB632E, #f97316); }
    .tooltip {
      position: absolute;
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      pointer-events: none;
      z-index: 50;
      white-space: nowrap;
    }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Accordion = ({ title, children, defaultOpen = false }) => {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div className="border border-gray-200 rounded-xl mb-4 overflow-hidden">
          <button
            onClick={() => setOpen(!open)}
            className="w-full px-6 py-4 text-left font-bold text-lg bg-orange-50 hover:bg-orange-100 flex justify-between items-center"
          >
            {title}
            <span className="text-xl">{open ? '−' : '+'}</span>
          </button>
          {open && (
            <div className="p-5 bg-white border-t border-gray-200 text-base leading-relaxed">
              {children}
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [tab, setTab] = useState('resumen');
      const [subTab, setSubTab] = useState('flujos');

      // Estados para proyecciones
      const [animarProyecciones, setAnimarProyecciones] = useState(false);
      const [yaCargadoProyecciones, setYaCargadoProyecciones] = useState(false);
      const [anioActivo, setAnioActivo] = useState(1);

      // Estados para la pestaña de precios dinámicos
      const [precioBase, setPrecioBase] = useState(15000);
      const [canchas, setCanchas] = useState(5);
      const [viendo, setViendo] = useState(8);
      const [intentando, setIntentando] = useState(4);
      const [cola, setCola] = useState(1);
      const [historica, setHistorica] = useState(6);
      const [vecinos, setVecinos] = useState(2);

      // Pestañas actualizadas
      const tabs = ['resumen', 'mercado', 'proyecciones', 'proyecto', 'precios', 'comparacion', 'emparejamientos', 'tecnologia'];

      // === RESUMEN ===
      const renderResumen = () => (
        <div className="space-y-10">
          <div className="text-center max-w-4xl mx-auto">
            <h1 className="text-5xl font-black text-orange-custom mb-6">Padel Club Misiones</h1>
            <p className="text-2xl text-gray-700 mb-8">
              Plataforma integral de pádel: matchmaking inteligente, reservas, torneos, ligas, marketplace y más.
            </p>
            <div className="bg-gradient-to-r from-orange-500 to-orange-600 text-white px-8 py-4 rounded-xl inline-block shadow-xl">
              <p className="text-xl font-bold">+18.000 jugadores · 28 complejos · 100% en Misiones</p>
            </div>
          </div>

          <div className="grid md:grid-cols-2 gap-6">
            <div className="stat-card bg-white p-6 rounded-xl">
              <h3 className="font-bold text-xl mb-3 text-orange-custom">Monetización desde el día 1</h3>
              <ul className="space-y-2">
                <li>• <strong>Reservas:</strong> Comisión del 10% (absorbemos descuentos)</li>
                <li>• <strong>Complejos:</strong> Paquetes premium de marketing y analytics</li>
                <li>• <strong>Profesores:</strong> Comisión del 15% en clases</li>
                <li>• <strong>Marketplace:</strong> Margen 30–40% en productos</li>
                <li>• <strong>Marcas:</strong> Publicidad segmentada</li>
              </ul>
            </div>
            <div className="stat-card bg-white p-6 rounded-xl">
              <h3 className="font-bold text-xl mb-3 text-orange-custom">Valor para Complejos</h3>
              <ul className="space-y-2">
                <li>• Aumento de ocupación en horarios valle</li>
                <li>• Retención con ligas y torneos</li>
                <li>• Descuentos cubiertos por la plataforma</li>
                <li>• Panel de analytics + marketing integrado</li>
              </ul>
            </div>
          </div>
        </div>
      );

      // === PROYECCIONES ===
      const renderProyecciones = () => {
        const datosPorAnio = {
          1: {
            usuarios: 18000,
            ingresos: 13200000,
            mau: [1500, 2800, 4200, 6000, 8500, 11000, 13500, 15500, 17000, 18000, 18500, 19000],
            ingresosMensuales: [300000, 600000, 1000000, 1800000, 2800000, 4200000, 5800000, 7500000, 9000000, 10200000, 11200000, 12000000]
          },
          2: {
            usuarios: 42000,
            ingresos: 32000000,
            mau: [20000, 24000, 27000, 30000, 33000, 35000, 37000, 39000, 40000, 41000, 41500, 42000],
            ingresosMensuales: [1500000, 2000000, 2800000, 4000000, 5500000, 7200000, 9000000, 11000000, 13000000, 15000000, 17000000, 19000000]
          },
          3: {
            usuarios: 75000,
            ingresos: 58000000,
            mau: [45000, 52000, 58000, 62000, 65000, 68000, 70000, 72000, 73000, 74000, 74500, 75000],
            ingresosMensuales: [3000000, 4000000, 5500000, 7500000, 10000000, 13000000, 16000000, 19000000, 22000000, 25000000, 27000000, 29000000]
          }
        };

        const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
        const datos = datosPorAnio[anioActivo];
        const maxHeightPx = 180;
        const valorAAltura = (valor, maxValor) => Math.max((valor / maxValor) * maxHeightPx, 4);
        const maxMAU = Math.max(...datos.mau);
        const maxIngresos = Math.max(...datos.ingresosMensuales);

        const formatARS = (num) => {
          return new Intl.NumberFormat('es-AR', {
            style: 'currency',
            currency: 'ARS',
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
          }).format(num);
        };

        // Componente Tooltip local (renderizado dentro del gráfico)
        const TooltipLocal = ({ x, y, value, visible }) => {
          if (!visible) return null;
          return (
            <div
              className="tooltip absolute z-10 bg-black text-white text-xs px-2 py-1 rounded whitespace-nowrap"
              style={{
                left: `${x}px`,
                top: `${y - 30}px`, // arriba de la barra
                transform: 'translateX(-50%)' // centrado
              }}
            >
              {value}
            </div>
          );
        };

        // Gráfico reutilizable
        const Grafico = ({ 
          titulo, 
          datos, 
          maxValor, 
          formato = (v) => `${v.toLocaleString()} usuarios`,
          color = "bg-orange-custom"
        }) => {
          const [tooltip, setTooltip] = useState({ x: 0, y: 0, value: '', visible: false });

          return (
            <div className="relative">
              <h3 className="text-xl font-bold mb-3">{titulo}</h3>
              <div className="flex items-end h-56 gap-1 bg-gray-50 p-4 rounded-lg relative">
                <TooltipLocal {...tooltip} />
                {datos.map((valor, i) => {
                  const altura = animarProyecciones ? valorAAltura(valor, maxValor) : 0;
                  return (
                    <div
                      key={i}
                      className="flex flex-col items-center flex-1"
                      onMouseEnter={(e) => {
                        const rect = e.currentTarget.getBoundingClientRect();
                        const contenedor = e.currentTarget.closest('.relative');
                        const contenedorRect = contenedor.getBoundingClientRect();
                        setTooltip({
                          visible: true,
                          x: rect.left - contenedorRect.left + rect.width / 2,
                          y: rect.top - contenedorRect.top,
                          value: formato(valor)
                        });
                      }}
                      onMouseLeave={() => setTooltip(prev => ({ ...prev, visible: false }))}
                    >
                      <div
                        className={`w-full ${color} rounded-t transition-all duration-1000 ease-out ${animarProyecciones ? '' : 'opacity-0'}`}
                        style={{ height: `${altura}px` }}
                      ></div>
                      <span className="text-xs mt-2 text-gray-600">{months[i]}</span>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        };

        return (
          <div className="space-y-10">
            <h2 className="text-4xl font-black text-center text-orange-custom">Proyecciones de Ingresos – Años 1, 2 y 3</h2>

            <div className="flex justify-center gap-4">
              {[1, 2, 3].map(a => (
                <button
                  key={a}
                  onClick={() => setAnioActivo(a)}
                  className={`px-6 py-3 font-bold rounded-lg ${anioActivo === a ? 'bg-orange-custom text-white' : 'bg-gray-200 hover:bg-gray-300'}`}
                >
                  Año {a}
                </button>
              ))}
            </div>

            <div className="grid grid-cols-2 md:grid-cols-3 gap-4 text-center">
              <div className="bg-white p-4 rounded-lg shadow">
                <div className="text-2xl font-black text-orange-custom">{(datos.usuarios / 1000).toFixed(0)}K</div>
                <div className="text-sm text-gray-600">Usuarios activos</div>
              </div>
              <div className="bg-white p-4 rounded-lg shadow">
                <div className="text-2xl font-black text-orange-custom">${(datos.ingresos / 1000000).toFixed(1)}M</div>
                <div className="text-sm text-gray-600">Ingresos anuales</div>
              </div>
              <div className="bg-white p-4 rounded-lg shadow">
                <div className="text-2xl font-black text-orange-custom">{Math.round(datos.ingresos / datos.usuarios)}</div>
                <div className="text-sm text-gray-600">ARS por usuario/año</div>
              </div>
            </div>

            {/* Gráfico: Usuarios activos */}
            <Grafico
              titulo="Usuarios Activos Mensuales (MAU)"
              datos={datos.mau}
              maxValor={maxMAU}
              formato={(v) => `${v.toLocaleString()} usuarios`}
              color="bg-orange-custom"
            />

            {/* Gráfico: Ingresos mensuales */}
            <Grafico
              titulo="Ingresos Mensuales (ARS)"
              datos={datos.ingresosMensuales}
              maxValor={maxIngresos}
              formato={formatARS}
              color="bg-green-500"
            />

            <div className="bg-orange-50 border-l-4 border-orange-custom p-4 rounded">
              <p className="text-sm">
                <strong>Supuestos:</strong> Crecimiento orgánico + adopción en complejos + torneos + misiones.
                Ingresos netos de la plataforma (comisiones, marketplace, clases, publicidad).
              </p>
            </div>
          </div>
        );
      };

      // === MERCADO ===
      const renderMercado = () => (
        <div className="space-y-8">
          <h2 className="text-4xl font-black text-center text-orange-custom">Mercado – Misiones</h2>
          <div className="grid md:grid-cols-2 gap-8">
            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold mb-3">Jugadores</h3>
              <ul className="space-y-2 text-lg">
                <li>• +18.000 activos en Posadas y zona</li>
                <li>• Crecimiento anual: 35%</li>
                <li>• 68% busca compañeros frecuentemente</li>
              </ul>
            </div>
            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold mb-3">Complejos</h3>
              <ul className="space-y-2 text-lg">
                <li>• 28 complejos operativos</li>
                <li>• Ocupación promedio: 58%</li>
                <li>• Cero plataformas de matchmaking locales</li>
              </ul>
            </div>
          </div>
        </div>
      );

      // === FLUJOS ===
      const flujos = [
        { titulo: "1. Reserva Individual o Dupla Tradicional", contenido: (
          <ol className="list-decimal pl-8 space-y-2">
            <li>Buscás canchas por zona, fecha y hora</li>
            <li>Filtrás por precio, tipo de cancha, techada/descubierta, valoraciones</li>
            <li>Ves precios dinámicos (pico +30%, valle -40%, anticipada, último minuto)</li>
            <li>Elegís única o recurrente (todos los martes 20 hs)</li>
            <li>Pagás con Mercado Pago</li>
            <li>Recibís QR + recordatorios automáticos</li>
            <li>Check-in al llegar</li>
          </ol>
        )},
        { titulo: "2. Tengo cancha, busco 1-3 jugadores", contenido: (
          <ol className="list-decimal pl-8 space-y-2">
            <li>Reservás la cancha</li>
            <li>Marcás “Buscar compañeros”</li>
            <li>Indicás cuántos faltan, posición (drive/revés), nivel y costo por persona</li>
            <li>Se publica en el feed</li>
            <li>IA sugiere jugadores y envía notificaciones push</li>
            <li>Aceptás/rechazás según perfil verificado</li>
            <li>Chat grupal automático + pagos divididos</li>
          </ol>
        )},
        { titulo: "3. Quiero jugar, busco partido abierto", contenido: "Navegas feed → filtrás → ves jugadores ya confirmados → te unís → pagás tu parte → entrás al chat y QR." },
        { titulo: "4. Crear Equipo Permanente", contenido: "Nombre + logo → dupla fija → estadísticas → desafiar rivales → ligas como equipo." },
        { titulo: "5. Emparejamiento Automático", contenido: "Activás “Quiero jugar” → IA cruza horarios, nivel y ubicación → te propone partidos perfectos." },
        { titulo: "6. Inscripción a Torneos", contenido: "Complejo crea torneo → inscribís sola o con compañero → IA sugiere pareja → brackets automáticos → premios vía Mercado Pago." },
        { titulo: "7. Ligas Zonales", contenido: "Puntos por partido → ranking semanal → ascenso/descenso → premios de temporada." },
        { titulo: "8. Misiones Diarias/Semanales", contenido: "Ejemplos: Juega hoy → 200 XP, Juega en horario valle → 20% off, Invita amigo → 500 XP." },
        { titulo: "9. Feed Social", contenido: "Publicás resultados, fotos, videos → likes, comentarios, check-ins." },
        { titulo: "10. Gestión Flexible de Reservas", contenido: "Recurrentes, lista de espera, extender turno en vivo, cambio de horario, swap y subarriendo." },
        { titulo: "11. Marketplace", contenido: "Paletas, pelotas, ropa → retiro en próximo partido o envío → reseñas y bundles." },
        { titulo: "12. Clases y Clinics", contenido: "Directorio de profesores → clases individuales/grupales → planes progresivos → reseñas." }
      ];

      // === PROYECTO ===
      const renderProyecto = () => (
        <div className="space-y-8">
          <h2 className="text-4xl font-black text-orange-custom">Proyecto Completo</h2>

          <div className="flex flex-wrap gap-2 border-b-2 border-orange-custom pb-2">
            {['flujos', 'caracteristicas', 'monetizacion', 'expansion', 'premios'].map(t => (
              <button key={t} onClick={() => setSubTab(t)}
                className={`px-5 py-2 font-bold rounded-t-lg ${subTab === t ? 'bg-orange-custom text-white' : 'bg-gray-200 hover:bg-gray-300'}`}>
                {t === 'flujos' ? '12 Flujos' : t === 'caracteristicas' ? 'Características' : t === 'monetizacion' ? 'Monetización' : t === 'expansion' ? 'Expansión' : 'Premios'}
              </button>
            ))}
          </div>

          {subTab === 'flujos' && (
            <div>
              <h3 className="text-3xl font-bold text-orange-custom mb-6">Flujos de Usuario</h3>
              {flujos.map((f, i) => (
                <Accordion key={i} title={f.titulo} defaultOpen={i < 3}>
                  {f.contenido}
                </Accordion>
              ))}
            </div>
          )}

          {subTab === 'caracteristicas' && (
            <div>
              <h3 className="text-3xl font-bold text-orange-custom mb-6">Características Clave</h3>
              <div className="grid md:grid-cols-2 gap-4">
                {[
                  "Matchmaking Inteligente con IA",
                  "Torneos con brackets automáticos",
                  "Ligas con ascenso/descenso",
                  "Misiones diarias + XP + niveles",
                  "Feed social y check-ins",
                  "Chat grupal con encuestas",
                  "Precios dinámicos (clima, horario, ocupación)",
                  "Reservas recurrentes y lista de espera"
                ].map((f, i) => (
                  <div key={i} className="flex items-start p-4 bg-orange-50 rounded-lg border border-orange-200">
                    <span className="feature-icon text-white w-8 h-8 rounded-full flex items-center justify-center mr-3 flex-shrink-0">
                      <i className="fas fa-check"></i>
                    </span>
                    <span>{f}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {subTab === 'monetizacion' && (
            <div className="grid md:grid-cols-2 gap-4">
              {[
                "Comisión 10% en reservas (descuentos absorbidos por plataforma)",
                "Suscripciones premium para complejos: $5,000 ARS/mes",
                "Comisión 15% en clases con profesores verificados",
                "Marketplace propio: margen 30–40% en productos",
                "Publicidad segmentada para marcas: banners, posts patrocinados"
              ].map((item, i) => (
                <div key={i} className="flex items-start p-4 bg-orange-50 rounded-lg border border-orange-200">
                  <span className="feature-icon text-white w-8 h-8 rounded-full flex items-center justify-center mr-3 flex-shrink-0">
                    <i className="fas fa-dollar-sign"></i>
                  </span>
                  <span>{item}</span>
                </div>
              ))}
            </div>
          )}

          {subTab === 'expansion' && (
            <div className="space-y-4">
              <h3 className="text-2xl font-bold text-orange-custom">Estrategia de Expansión</h3>
              <ul className="list-disc pl-6 space-y-2">
                <li><strong>Fase 1:</strong> Consolidación en toda Misiones (Posadas, Oberá, Iguazú, Eldorado)</li>
                <li><strong>Fase 2:</strong> Escalado a provincias vecinas (Corrientes, Chaco, Formosa)</li>
                <li><strong>Fase 3:</strong> Multi-deporte: misma arquitectura para tenis, fútbol 5, pickleball</li>
              </ul>
            </div>
          )}

          {subTab === 'premios' && (
            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold text-orange-custom mb-3">Premios sin riesgo legal</h3>
              <ul className="list-disc pl-6 space-y-2">
                <li>Créditos canjeables en reservas</li>
                <li>Productos del marketplace (paletas, ropa, accesorios)</li>
                <li>Clases gratuitas con profesores certificados</li>
                <li>Servicios: estacionamiento VIP, acceso a canchas premium</li>
                <li><strong>Nunca en efectivo</strong> → evita regulaciones de juego de azar</li>
              </ul>
            </div>
          )}
        </div>
      );

      // === PRECIOS DINÁMICOS ===
      const renderPrecios = () => {
        // Parámetros internos del algoritmo
        const NORMALIZADOR = 0.6;
        const SUAVIZADO = 0.3;
        const MULTIPLICADOR_MIN = 0.8;
        const MULTIPLICADOR_MAX = 2.5;

        // Estado para suavizado por horario (simplificado como variable local)
        let Mprevio = 1.0;

        // Función principal del algoritmo
        const calcularPrecio = () => {
          if (canchas <= 0) return precioBase * MULTIPLICADOR_MAX;

          // Sanitizar datos
          const dViendo = Math.max(0, viendo || 0);
          const dIntentando = Math.max(0, intentando || 0);
          const dCola = Math.max(0, cola || 0);
          const dHistorica = Math.max(0, historica || 0);
          const dVecinos = Math.max(0, vecinos || 0);

          // Demanda total ponderada
          const Dtotal = (0.35 * dViendo) + (0.30 * dIntentando) + (0.10 * dCola) + (0.20 * dHistorica) + (0.05 * dVecinos);

          // Ratio
          const R = Dtotal / canchas;

          // Multiplicador crudo
          let Mcrudo = 1 + (R - 1) * NORMALIZADOR;

          // Límites
          let Mlimitado = Math.min(Math.max(Mcrudo, MULTIPLICADOR_MIN), MULTIPLICADOR_MAX);

          // Suavizado
          const M = SUAVIZADO * Mlimitado + (1 - SUAVIZADO) * Mprevio;

          // Actualizar Mprevio para la próxima simulación
          Mprevio = M;

          // Precio final
          return precioBase * M;
        };

        const precioFinal = calcularPrecio();

        return (
          <div className="space-y-8">
            <h2 className="text-4xl font-black text-center text-orange-custom">Precios Dinámicos</h2>

            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold mb-4">¿Cómo funciona?</h3>
              <p className="mb-4">
                Nuestro algoritmo ajusta automáticamente el precio de cada turno según la relación entre 
                <strong> demanda en tiempo real</strong> y <strong>capacidad disponible</strong>.
              </p>
              <ul className="list-disc pl-6 mb-4 space-y-2">
                <li><strong>Demanda total:</strong> Combina usuarios viendo, intentando reservar, en cola, histórico y horarios vecinos</li>
                <li><strong>Suavizado:</strong> Evita saltos bruscos entre cálculos sucesivos</li>
                <li><strong>Rango:</strong> Precio final entre 80% y 250% del precio base</li>
              </ul>
              <p>
                Inspirado en modelos de Uber, pero calibrado para el mercado de pádel en Misiones.
              </p>
            </div>

            <div className="bg-gray-50 p-6 rounded-xl">
              <h3 className="text-2xl font-bold mb-4">Probador del Algoritmo</h3>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label className="block text-sm font-medium mb-2">Precio Base (ARS)</label>
                  <input
                    type="number"
                    value={precioBase}
                    onChange={(e) => setPrecioBase(Number(e.target.value))}
                    className="w-full p-2 border border-gray-300 rounded"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-2">Canchas Disponibles</label>
                  <input
                    type="number"
                    value={canchas}
                    onChange={(e) => setCanchas(Number(e.target.value))}
                    className="w-full p-2 border border-gray-300 rounded"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-2">Usuarios viendo horario</label>
                  <input
                    type="number"
                    value={viendo}
                    onChange={(e) => setViendo(Number(e.target.value))}
                    className="w-full p-2 border border-gray-300 rounded"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-2">Usuarios intentando reservar</label>
                  <input
                    type="number"
                    value={intentando}
                    onChange={(e) => setIntentando(Number(e.target.value))}
                    className="w-full p-2 border border-gray-300 rounded"
                  />

                  <label className="block text-sm font-medium mb-2">Demanda histórica</label>

      // === COMPARACIÓN DE MODELOS COMERCIALES ===
      const renderComparacion = () => {
        // Datos de ejemplo para un día tipo
        const ejemploDia = [
          { hora: "10:00", dem: "Baja", oc: "2/4", fijo: 12000, din: 8400 },

          { hora: "18:00", dem: "Muy alta", oc: "4/4", fijo: 12000, din: 15600 },
          { hora: "20:00", dem: "Muy alta", oc: "4/4", fijo: 12000, din: 15600 },
          { hora: "22:00", dem: "Baja", oc: "1/4", fijo: 12000, din: 13200 }
        ];

        const totalFijo = ejemploDia.reduce((acc, h) => acc + h.fijo, 0);
        const totalDin = ejemploDia.reduce((acc, h) => acc + h.din, 0);
        const diferencia = totalDin - totalFijo;

        // Máximo valor para normalizar barras
        const maxValor = Math.max(...ejemploDia.flatMap(h => [h.fijo, h.din]));

        return (
          <div className="space-y-8 relative">
            <h2 className="text-4xl font-black text-center text-orange-custom">Comparación de Modelos Comerciales</h2>

            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold mb-4">Precios Fijos vs. Precios Dinámicos</h3>
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-orange-50">
                    <th className="p-2 text-left">Criterio</th>
                    <th className="p-2 text-center">Precios Fijos</th>
                    <th className="p-2 text-center">Precios Dinámicos</th>
                    <th className="p-2 text-center">¿Quién gana?</th>
                  </tr>
                </thead>
                <tbody>
                  <tr className="border-b">
                    <td className="p-2">Simplicidad</td>
                    <td className="p-2 text-center">✅ Muy simple</td>
                    <td className="p-2 text-center">⚠️ Requiere explicación</td>
                    <td className="p-2 text-center">Fijos</td>
                  </tr>
                  <tr className="border-b">
                    <td className="p-2">Transparencia</td>
                    <td className="p-2 text-center">✅ Total</td>
                    <td className="p-2 text-center">⚠️ Dinámica</td>
                    <td className="p-2 text-center">Fijos</td>
                  </tr>
                  <tr className="border-b">
                    <td className="p-2">Aumento de ingresos</td>
                    <td className="p-2 text-center">❌ Limitado</td>
                    <td className="p-2 text-center">✅ Muy alto en picos</td>
                    <td className="p-2 text-center">Dinámicos</td>
                  </tr>
                  <tr className="border-b">
                    <td className="p-2">Atracción horarios valle</td>
                    <td className="p-2 text-center">❌ Limitada</td>
                    <td className="p-2 text-center">✅ Muy alta</td>
                    <td className="p-2 text-center">Dinámicos</td>
                  </tr>
                  <tr className="border-b">
                    <td className="p-2">Competitividad</td>
                    <td className="p-2 text-center">❌ Igual al resto</td>
                    <td className="p-2 text-center">✅ Diferenciador</td>
                    <td className="p-2 text-center">Dinámicos</td>
                  </tr>
                  <tr className="border-b">
                    <td className="p-2">Experiencia de usuario</td>
                    <td className="p-2 text-center">❌ Puede sentirse injusta</td>
                    <td className="p-2 text-center">✅ Se percibe como justa</td>
                    <td className="p-2 text-center">Dinámicos</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold mb-4">Ejemplo de Día Tipo</h3>
              <table className="w-full text-sm">
                <thead>
                  <tr className="bg-orange-50">
                    <th className="p-2 text-left">Hora</th>
                    <th className="p-2 text-center">Demanda</th>
                    <th className="p-2 text-center">Ocupación</th>
                    <th className="p-2 text-center">Precio Fijo</th>
                    <th className="p-2 text-center">Precio Dinámico</th>
                  </tr>
                </thead>
                <tbody>
                  {ejemploDia.map((h, i) => (
                    <tr key={i} className="border-b">
                      <td className="p-2">{h.hora}</td>
                      <td className="p-2 text-center">{h.dem}</td>
                      <td className="p-2 text-center">{h.oc}</td>
                      <td className="p-2 text-center">${h.fijo.toLocaleString()}</td>
                      <td className="p-2 text-center">${h.din.toLocaleString()}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="mt-4 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-blue-50 p-4 rounded-lg text-center">
                  <div className="text-2xl font-bold">$84,000</div>
                  <div className="text-sm">Ingreso total con precios fijos</div>
                </div>
                <div className="bg-green-50 p-4 rounded-lg text-center">
                  <div className="text-2xl font-bold">$91,200</div>
                  <div className="text-sm">Ingreso total con precios dinámicos</div>
                </div>
                <div className="bg-purple-50 p-4 rounded-lg text-center">
                  <div className="text-2xl font-bold">+$7,200</div>
                  <div className="text-sm">Diferencia (8.6% más)</div>
                </div>
              </div>
            </div>

            {/* Gráfico de barras */}
            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold mb-4">Comparación Visual de Ingresos por Hora</h3>
              <div className="space-y-4">
                {ejemploDia.map((h, i) => {
                  const anchoFijo = (h.fijo / maxValor) * 100;
                  const anchoDin = (h.din / maxValor) * 100;
                  return (
                    <div key={i} className="flex items-center">
                      <div className="w-16 text-sm text-gray-600">{h.hora}</div>
                      <div className="flex-1 flex h-8 relative">
                        {/* Barra fija */}
                        <div
                          className="h-full bg-blue-500 rounded-r"
                          style={{ width: `${anchoFijo}%` }}
                          onMouseEnter={(e) => {
                            const rect = e.currentTarget.getBoundingClientRect();
                            const tooltip = document.getElementById('tooltip-comparacion');
                            tooltip.style.display = 'block';
                            tooltip.textContent = `Fijo: $${h.fijo.toLocaleString()}`;

                            tooltip.style.display = 'none';

                        {/* Barra dinámica superpuesta */}
                        <div
                          className="h-full bg-orange-500 rounded-r absolute"
                          style={{ width: `${anchoDin}%` }}
                          onMouseEnter={(e) => {
                            const rect = e.currentTarget.getBoundingClientRect();
                            const tooltip = document.getElementById('tooltip-comparacion');
                            tooltip.style.display = 'block';
                            tooltip.textContent = `Dinámico: $${h.din.toLocaleString()}`;
                            tooltip.style.left = `${rect.left + window.scrollX}px`;
                            tooltip.style.top = `${rect.top + window.scrollY - 30}px`;

              <p>
                Los precios fijos ofrecen simplicidad, pero limitan el potencial de ingresos. 
                Los precios dinámicos adaptan el valor al mercado real, aumentan la ocupación en horarios valle 
                y maximizan ingresos en picos, sin sacrificar la equidad. Es la evolución natural del modelo tradicional.
              </p>
            </div>
          </div>
        );

      // === EMPAREJAMIENTOS INTELIGENTES ===
      const renderEmparejamientos = () => {
        return (
          <div className="space-y-8">
            <h2 className="text-4xl font-black text-center text-orange-custom">Emparejamientos Inteligentes</h2>

            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold mb-4">¿Qué es el matchmaking inteligente?</h3>
              <p className="mb-4">
                Nuestro sistema de emparejamiento utiliza algoritmos avanzados para formar partidos de pádel de 4 jugadores 
                de forma <strong>equilibrada, justa y eficiente</strong>, según el perfil, nivel, ubicación y disponibilidad de los usuarios.
              </p>
              <p>
                A diferencia de sistemas simples, nuestro matchmaking considera múltiples variables para crear partidos 
                donde todos disfruten del juego y se sientan cómodos con su nivel de competencia.
              </p>
            </div>

            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold mb-4">Casos de Uso del Matchmaking</h3>

              <Accordion title="Caso 1: Tengo 3 jugadores → Busco 1 más">
                <p>Un jugador crea un grupo de 3 y marca “Busco 1 jugador más”.</p>
                <ul className="list-disc pl-6 mt-2 space-y-1">
                  <li>El sistema filtra candidatos por <strong>categoría (±1)</strong>, <strong>ubicación</strong> y <strong>disponibilidad</strong>.</li>
                  <li>Envía notificaciones push a los mejores candidatos.</li>
                  <li>El grupo puede ver perfiles, ratings y elegir aceptar/rechazar.</li>
                </ul>
              </Accordion>

              <Accordion title="Caso 2: Soy 1 jugador → Busco 3 más">
                <p>Un jugador suelto busca unirse a un grupo de 4 o formar uno nuevo.</p>
                <ul className="list-disc pl-6 mt-2 space-y-1">
                  <li>Se busca un grupo incompleto (2 o 3 jugadores).</li>
                  <li>O se intenta armar un grupo nuevo con otros 3 usuarios sueltos.</li>
                  <li>Se prioriza nivel y disponibilidad horaria.</li>
                </ul>
              </Accordion>

              <Accordion title="Caso 3: Soy un crew (dupla fija) → Busco otra dupla">
                <p>Un crew (2 jugadores fijos) busca completar un partido con otro crew.</p>
                <ul className="list-disc pl-6 mt-2 space-y-1">
                  <li>Se buscan otros crews o duplas sueltas.</li>
                  <li>Se prioriza nivel promedio y estilo de juego.</li>
                  <li>Se notifica a crews objetivo con opción de “Desafiar” o “Aceptar partido amistoso”.</li>
                </ul>
              </Accordion>

              <Accordion title="Caso 4: Emparejamiento Automático (IA)">
                <p>El usuario activa “Quiero jugar ahora” y el sistema le sugiere partidos.</p>
                <ul className="list-disc pl-6 mt-2 space-y-1">
                  <li>IA analiza perfil, horarios, nivel y amistades.</li>
                  <li>Busca partidos compatibles o crea uno nuevo.</li>
                  <li>Notifica al usuario con opciones personalizadas.</li>
                </ul>
              </Accordion>

              <Accordion title="Caso 5: Busco un partido abierto">
                <p>El usuario navega el feed de partidos disponibles y se une o postula.</p>
                <ul className="list-disc pl-6 mt-2 space-y-1">
                  <li>Se filtran partidos por nivel, ubicación y horario.</li>
                  <li>El usuario puede unirse directamente o esperar aprobación.</li>
                  <li>El sistema divide costos y coordina QR de acceso.</li>
                </ul>
              </Accordion>
            </div>

            <div className="bg-white p-6 rounded-xl shadow">
              <h3 className="text-2xl font-bold mb-4">Algoritmo de Compatibilidad</h3>
              <p>El sistema calcula un <strong>score de compatibilidad</strong> entre usuarios o grupos para formar partidos equilibrados:</p>
              <ul className="list-disc pl-6 mt-4 space-y-2">
                <li><strong>Nivel de juego:</strong> Diferencia de categoría (0 puntos si es el mismo, -10 por cada categoría de diferencia).</li>
                <li><strong>Ubicación:</strong> Distancia entre usuarios (cercanía geográfica suma puntos).</li>
                <li><strong>Horario:</strong> Coincidencia exacta de disponibilidad.</li>
                <li><strong>Estilo:</strong> Complementariedad (drive con reves, estilo agresivo con defensivo).</li>
                <li><strong>Historial:</strong> Experiencia previa (si ya jugaron bien juntos).</li>
                <li><strong>Reputación:</strong> Puntualidad, fair play, comentarios.</li>
              </ul>
              <div className="mt-4 p-4 bg-gray-50 rounded-lg">
                <p className="font-mono text-sm">
                  Score = (Nivel_compatibilidad * 10) + (Ubicación_compatibilidad * 5) + (Horario_exacto * 20) + ...
                </p>
              </div>
            </div>

            <div className="bg-orange-50 border-l-4 border-orange-custom p-4 rounded">
              <h3 className="text-xl font-bold mb-2">Ventaja Competitiva</h3>
              <p>
                Nuestro matchmaking es el primero en Misiones que considera múltiples factores para formar partidos justos y agradables. 
                Esto mejora la <strong>experiencia de usuario</strong>, <strong>aumenta la retención</strong> y <strong>potencia la ocupación de canchas</strong> en horarios valle.
              </p>
            </div>
          </div>
        );
      };

      // === TECNOLOGÍA Y ESTRATEGIA DE LANZAMIENTO ===
      const renderTecnologia = () => (
        <div className="space-y-8">
          <h2 className="text-4xl font-black text-center text-orange-custom">Tecnología y Estrategia de Lanzamiento</h2>

          {/* Opción 1: MVP GRATIS */}
          <div className="bg-white p-6 rounded-xl shadow">
            <h3 className="text-2xl font-bold mb-4 text-orange-custom">OptionsResolver 1: MVP 100% Gratis (Meses 1-2)</h3>
            <ul className="space-y-2">
              <li>• <strong>Dominio:</strong> Usar subdominio gratis (ej: `padel-club-misiones.github.io`)</li>
              <li>• <strong>Hosting web:</strong> GitHub Pages (gratis, HTTPS incluido)</li>
              <li>• <strong>Backend:</strong> Supabase (plan gratuito: 500MB DB, 1GB storage, 2M requests/mes)</li>
              <li>• <strong>App móvil:</strong> No se desarrolla aún; la web es 100% responsive</li>
              <li>• <strong>Costo total:</strong> <span className="font-bold">$0 USD/mes</span></li>
            </ul>
            <p className="mt-3 text-sm">
              Ideal para validar flujos, conseguir los primeros 3 complejos y 500 jugadores.
            </p>
          </div>

          {/* Opción 2: Hosting económico LATAM */}
          <div className="bg-white p-6 rounded-xl shadow">
            <h3 className="text-2xl font-bold mb-4 text-orange-custom">Opción 2: Hosting en Argentina/LATAM (Desde Mes 3)</h3>
            <ul className="space-y-2">
              <li>• <strong>Dominio propio:</strong> `.com.ar` o `.com` (~$300–$800 ARS/año en DonWeb, Hostinger o Nic.ar)</li>
              <li>• <strong>Hosting web:</strong> Hostinger, DonWeb o Vercel (plan básico ~$200–$500 ARS/mes)</li>
              <li>• <strong>Soporte técnico local:</strong> Ideal si no hay equipo técnico</li>
              <li>• <strong>Constructores de páginas:</strong> Si no hay desarrolladores, se puede armar una landing con WordPress + Elementor o Webflow</li>
              <li>• <strong>Integraciones:</strong> Mercado Pago, Google Maps, WhatsApp</li>
            </ul>
            <p className="mt-3 text-sm">
              Permite tener marca profesional y mejor posicionamiento SEO desde el inicio.
            </p>
          </div>

          {/* Opción 3: Escalado profesional (Mes 6+) */}
          <div className="bg-white p-6 rounded-xl shadow">
            <h3 className="text-2xl font-bold mb-4 text-orange-custom">Opción 3: Escalado Profesional (Mes 6 en adelante)</h3>
            <ul className="space-y-2">
              <li>• <strong>Frontend Web:</strong> Vercel Pro ($20 USD/mes)</li>
              <li>• <strong>Backend:</strong> Supabase Pro ($25 USD/mes)</li>
              <li>• <strong>App móvil:</strong> Expo EAS ($29 USD/mes)</li>
              <li>• <strong>Monitoreo:</strong> Sentry + PostHog (gratis en inicio, luego ~$20 USD/mes)</li>
              <li>• <strong>Costo total estimado:</strong> <span className="font-bold">~$230 USD/mes</span> (equivalente a ~$200,000 ARS/mes)</li>
            </ul>
            <p className="mt-3 text-sm">
              Infraestructura 100% serverless, escalable a 100K usuarios sin cambios arquitectónicos.
            </p>
          </div>

          {/* Recomendación final */}
          <div className="bg-orange-50 border-l-4 border-orange-custom p-4 rounded">
            <p className="text-sm">
              <strong>Recomendación:</strong> Empezar con la Opción 1 (gratis) para validar el modelo.
              Al superar los 1,000 jugadores activos, migrar a dominio propio y hosting en Hostinger/DonWeb.
              Al alcanzar ingresos mensuales de $5M+ ARS, escalar a Vercel + Supabase Pro.
            </p>
          </div>
        </div>
      );

      const tabContent = () => {
        if (tab === 'resumen') return renderResumen();
        if (tab === 'mercado') return renderMercado();
        if (tab === 'proyecciones') return renderProyecciones();
        if (tab === 'proyecto') return renderProyecto();
        if (tab === 'precios') return renderPrecios();
        if (tab === 'comparacion') return renderComparacion();
        if (tab === 'emparejamientos') return renderEmparejamientos();
        if (tab === 'tecnologia') return renderTecnologia();
      };

      // Activar animación cuando se entra a "proyecciones"
      useEffect(() => {
        if (tab === 'proyecciones' && !yaCargadoProyecciones) {
          const timer = setTimeout(() => {
            setAnimarProyecciones(true);
            setYaCargadoProyecciones(true);
          }, 100);
          return () => clearTimeout(timer);
        }
        if (tab !== 'proyecciones' && yaCargadoProyecciones) {
          setAnimarProyecciones(false);
          setYaCargadoProyecciones(false);
        }
      }, [tab, yaCargadoProyecciones]);

      return (
        <div className="min-h-screen bg-gradient-to-br from-orange-50 to-amber-50 relative">
          {/* Tooltip global para la pestaña de comparación */}
          <div id="tooltip-comparacion" className="tooltip absolute z-50 hidden"></div>

          <nav className="sticky top-0 bg-white shadow-xl border-b-4 border-orange-custom z-50">
            <div className="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
              <div className="flex items-center space-x-4">
                <div className="bg-orange-custom text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl font-black">PC</div>
                <div>
                  <h1 className="text-3xl font-black text-orange-custom">Padel Club</h1>
                  <p className="text-xl font-semibold">Misiones</p>
                </div>
              </div>
              <a href="mailto:hola@padelclubmisiones.com.ar" className="bg-orange-custom hover:bg-orange-700 text-white font-bold text-lg px-6 py-3 rounded-lg shadow transition">

            </div>

          <div className="max-w-7xl mx-auto px-4 sm:px-6 py-10">
            <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
              <div className="flex flex-wrap border-b-2 border-orange-custom">
                {tabs.map(t => (
                  <button key={t} onClick={() => setTab(t)}
                    className={`px-4 py-4 font-bold text-base flex-1 md:flex-none transition ${tab === t ? 'bg-orange-custom text-white' : 'bg-gray-100 hover:bg-gray-200'}`}>
                    {t === 'resumen' ? 'Resumen' : 
                     t === 'mercado' ? 'Mercado' : 
                     t === 'proyecciones' ? 'Proyecciones' : 
                     t === 'proyecto' ? 'Proyecto' : 
                     t === 'precios' ? 'Precios Dinámicos' : 
                     t === 'comparacion' ? 'Comparación de Modelos' : 
                     t === 'emparejamientos' ? 'Emparejamientos Inteligentes' : 
                     'Tecnología'}
                  </button>
                ))}
              </div>
              <div className="p-6 md:p-10">
                {tabContent()}
              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
